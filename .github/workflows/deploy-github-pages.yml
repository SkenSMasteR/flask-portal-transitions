name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask

      - name: Generate static site
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          from app import app

          out_dir = Path('out')
          if out_dir.exists():
              shutil.rmtree(out_dir)
          out_dir.mkdir(parents=True, exist_ok=True)

          client = app.test_client()
          routes = [
              ('/', out_dir / 'index.html'),
              ('/page/orange', out_dir / 'page' / 'orange' / 'index.html'),
              ('/page/blue', out_dir / 'page' / 'blue' / 'index.html'),
              ('/page/purple', out_dir / 'page' / 'purple' / 'index.html'),
          ]

          for route, target in routes:
              response = client.get(route)
              if response.status_code != 200:
                  raise SystemExit(f'Route {route} returned {response.status_code}')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(response.data)

          shutil.copytree('static', out_dir / 'static')
          PY

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: out
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
